name: savenest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savenest}
      POSTGRES_USER: ${POSTGRES_USER:-savenest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-savenest}
      DATABASE_USERNAME: ${POSTGRES_USER:-savenest}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:8080"
    profiles: ["app"]

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    depends_on: [backend]
    ports:
      - "127.0.0.1:3000:3000"
    profiles: ["app"]

volumes:
  pgdata:
