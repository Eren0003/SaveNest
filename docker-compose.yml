name: savenest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savenest}
      POSTGRES_USER: ${POSTGRES_USER:-savenest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local SMTP catcher for password-reset emails. Web inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-savenest}
      DATABASE_USERNAME: ${POSTGRES_USER:-savenest}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:?Set PASSWORD_RESET_SECRET in .env}
      MAIL_HOST: ${COMPOSE_MAIL_HOST:-mailpit}
      MAIL_PORT: ${COMPOSE_MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-SaveNest <no-reply@savenest.local>}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    ports:
      - "127.0.0.1:8080:8080"
    profiles: ["app"]

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    depends_on: [backend]
    ports:
      - "127.0.0.1:3000:3000"
    profiles: ["app"]

volumes:
  pgdata:
